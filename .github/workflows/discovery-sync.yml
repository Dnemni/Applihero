name: Sync discovery jobs

on:
  schedule:
    # One complete, sharded catalog sweep at the start of every hour.
    - cron: "0 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  sync:
    name: Scan catalog shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    concurrency:
      group: discovery-sync-${{ matrix.shard }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Trigger secure production sync
        env:
          DISCOVERY_CRON_SECRET: ${{ secrets.DISCOVERY_CRON_SECRET }}
          DISCOVERY_CRON_URL: https://www.applihero.com/api/cron/discover?shard=${{ matrix.shard }}&shards=4
        run: |
          if [ -z "$DISCOVERY_CRON_SECRET" ]; then
            echo "DISCOVERY_CRON_SECRET is not configured."
            exit 1
          fi

          curl --fail-with-body --silent --show-error \
            --max-time 300 \
            --retry 2 \
            --retry-all-errors \
            --header "Authorization: Bearer $DISCOVERY_CRON_SECRET" \
            "$DISCOVERY_CRON_URL"
