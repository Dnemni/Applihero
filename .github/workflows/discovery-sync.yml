name: Sync discovery jobs

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  dispatch:
    name: Enqueue hourly catalog scan
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Create idempotent source tasks
        env:
          DISCOVERY_CRON_SECRET: ${{ secrets.DISCOVERY_CRON_SECRET }}
          DISCOVERY_CRON_URL: https://www.applihero.com/api/cron/discover/dispatch
        run: |
          test -n "$DISCOVERY_CRON_SECRET"
          curl --fail-with-body --silent --show-error --max-time 30 --retry 2 --retry-all-errors \
            --header "Authorization: Bearer $DISCOVERY_CRON_SECRET" "$DISCOVERY_CRON_URL"

  worker:
    name: Claim discovery work ${{ matrix.worker }}
    needs: dispatch
    runs-on: ubuntu-latest
    # Four jobs, one task per call: only four sources run at once. Each job
    # keeps claiming until the hour's queue is empty, which provides capacity
    # for the full catalog rather than only one small batch per schedule.
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        # Four in-flight sources keeps provider and Postgres writes below the
        # contention observed at 24 concurrent scans.
        worker: [1, 2, 3, 4]
    steps:
      - name: Drain bounded source tasks at safe concurrency
        env:
          DISCOVERY_CRON_SECRET: ${{ secrets.DISCOVERY_CRON_SECRET }}
          DISCOVERY_CRON_URL: https://www.applihero.com/api/cron/discover/worker?limit=1
        run: |
          test -n "$DISCOVERY_CRON_SECRET"
          curl --fail-with-body --silent --show-error --max-time 300 --retry 1 --retry-all-errors \
            --header "Authorization: Bearer $DISCOVERY_CRON_SECRET" "$DISCOVERY_CRON_URL&drain=1"

  finalize:
    name: Finalize discovery enrichment and digests
    needs: [dispatch, worker]
    if: ${{ always() && needs.dispatch.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Process independent maintenance queues
        env:
          DISCOVERY_CRON_SECRET: ${{ secrets.DISCOVERY_CRON_SECRET }}
          DISCOVERY_CRON_URL: https://www.applihero.com/api/cron/discover/finalize
        run: |
          test -n "$DISCOVERY_CRON_SECRET"
          curl --fail-with-body --silent --show-error --max-time 120 --retry 1 --retry-all-errors \
            --header "Authorization: Bearer $DISCOVERY_CRON_SECRET" "$DISCOVERY_CRON_URL"
